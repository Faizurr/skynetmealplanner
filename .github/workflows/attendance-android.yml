name: attendance-android
on:
  push:
    paths: ['attendance/android/**', 'attendance/scripts/fetch-models.sh', '.github/workflows/attendance-android.yml']
  pull_request:
    paths: ['attendance/android/**', 'attendance/scripts/fetch-models.sh', '.github/workflows/attendance-android.yml']
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode for this build'
        required: false
        default: '1'
      version_name:
        description: 'versionName for this build'
        required: false
        default: '1.0.0'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attendance/android
    env:
      VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
      VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch and verify face models
        run: bash ../scripts/fetch-models.sh
      - name: Unit tests (core logic)
        run: ./gradlew --no-daemon :core:test
      - name: Restore release keystore (only when secrets are configured)
        env:
          KEYSTORE_B64: ${{ secrets.KIOSK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kiosk-release.jks"
            echo "KIOSK_KEYSTORE_PATH=$RUNNER_TEMP/kiosk-release.jks" >> "$GITHUB_ENV"
          else
            echo "No KIOSK_KEYSTORE_BASE64 secret: release APK will be unsigned; debug APK is still produced."
          fi
      - name: Build APKs
        env:
          KIOSK_KEYSTORE_PASSWORD: ${{ secrets.KIOSK_KEYSTORE_PASSWORD }}
          KIOSK_KEY_ALIAS: ${{ secrets.KIOSK_KEY_ALIAS }}
          KIOSK_KEY_PASSWORD: ${{ secrets.KIOSK_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease -PkioskVersionCode=$VERSION_CODE -PkioskVersionName=$VERSION_NAME
      - name: APK checksums and signing certificate
        run: |
          find app/build/outputs/apk -name '*.apk' -exec sha256sum {} \;
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          for f in $(find app/build/outputs/apk -name '*.apk'); do echo "== $f"; $APKSIGNER verify --print-certs "$f" || true; done
      - name: Verify APK contents (models, native libs, permissions, no secrets)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          for f in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/*.apk; do
            echo "== $f ($(du -h "$f" | cut -f1))"
            unzip -l "$f" > contents.txt
            grep -E "assets/models/face_detection_yunet_2023mar.onnx" contents.txt
            grep -E "assets/models/face_recognition_sface_2021dec.onnx" contents.txt
            grep -E "lib/arm64-v8a/libopencv_java4.so" contents.txt
            grep -E "lib/armeabi-v7a/libopencv_java4.so" contents.txt
            "$BT/aapt2" dump badging "$f" | grep -E "^package:|sdkVersion|targetSdkVersion|uses-permission|launchable-activity"
            "$BT/aapt2" dump badging "$f" | grep -q "android.permission.CAMERA"
            ! unzip -p "$f" 'classes*.dex' | grep -aE "BEGIN (RSA |EC )?PRIVATE KEY|re_[A-Za-z0-9]{20,}|postgres://" || { echo "secret-like string found in dex"; exit 1; }
          done
          echo "APK content checks passed"
      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-apks-${{ env.VERSION_NAME }}
          path: |
            attendance/android/app/build/outputs/apk/**/*.apk
            attendance/android/app/build/reports/lint-results-debug.html
