name: attendance-web
on:
  push:
    paths: ['attendance/web/**', '.github/workflows/attendance-web.yml']
  pull_request:
    paths: ['attendance/web/**', '.github/workflows/attendance-web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attendance/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: attendance/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: owner-pwa-dist
          path: attendance/web/dist
